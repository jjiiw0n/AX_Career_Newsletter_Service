name: Career Newsletter Service

on:
  workflow_dispatch:
  schedule:
    # 매일 11:00 KST (02:00 UTC) 실행
    - cron: '0 2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test service
        run: npm test
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Run Monitor Service
        run: node monitor_v2.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Daily newsletter remains daily; recruitment digest is Monday-only in KST.
          JOB_MONITORING_ENABLED: 'true'
          JOB_MONITORING_SOURCES: 'etri,experience,knda,youth'
          JOB_MONITORING_RECIPIENTS: 'jeew0n.lee.217@gmail.com'
